name: OSHB proximity candidate feasibility

on:
  pull_request:
    paths:
      - "scripts/corpora/oshb_pattern_candidates.py"
      - "scripts/corpora/OSHBPATTERN-README.md"
      - "tests/corpora/test_oshb_pattern_candidates.py"
      - ".github/workflows/oshb-proximity-candidate.yml"
  push:
    branches: [main]
    paths:
      - "scripts/corpora/oshb_pattern_candidates.py"
      - "scripts/corpora/OSHBPATTERN-README.md"
      - "tests/corpora/test_oshb_pattern_candidates.py"

permissions:
  contents: read

jobs:
  candidate-search-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m py_compile scripts/corpora/oshb_pattern_candidates.py
      - name: Run adversarial candidate-search tests
        run: python -m unittest discover -s tests/corpora -p "test_oshb_pattern_candidates.py" -v
