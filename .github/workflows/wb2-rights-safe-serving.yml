name: WB-2 Rights-Safe Serving

on:
  pull_request:
    paths:
      - 'database/**'
      - 'scripts/corpora/**'
      - 'requirements-corpus.txt'
      - 'requirements-contracts.txt'
      - 'contracts/v1.1/corpus-source-registry.json'
      - 'contracts/v1.1/hebrew-bible-canon-system.json'
      - 'contracts/v1.1/json-schema/release-manifest.schema.json'
      - 'contracts/v1.1/json-schema/wb2-serving-build-report.schema.json'
      - 'architecture/whole-bible-base-product.md'
      - 'architecture/corpus-source-integration.md'
      - 'architecture/database-api-cross-stage-contract-v1.1.md'
      - '.github/workflows/wb2-rights-safe-serving.yml'
      - 'PROJECT_STATE.md'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'scripts/corpora/**'
      - 'requirements-corpus.txt'
      - 'requirements-contracts.txt'
      - 'contracts/v1.1/corpus-source-registry.json'
      - 'contracts/v1.1/hebrew-bible-canon-system.json'
      - 'contracts/v1.1/json-schema/release-manifest.schema.json'
      - 'contracts/v1.1/json-schema/wb2-serving-build-report.schema.json'
      - 'architecture/whole-bible-base-product.md'
      - 'architecture/corpus-source-integration.md'
      - 'architecture/database-api-cross-stage-contract-v1.1.md'
      - '.github/workflows/wb2-rights-safe-serving.yml'

permissions:
  contents: read

jobs:
  wb2-serving:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hcb_wb2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hcb_wb2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hcb_wb2
      SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned corpus and contract tooling
        run: python -m pip install -r requirements-corpus.txt -r requirements-contracts.txt
      - name: Compile WB-1 and WB-2 tooling
        run: |
          python -m py_compile \
            scripts/corpora/partition_wb_corpus_for_relational.py \
            scripts/corpora/load_wb1_postgres.py \
            scripts/corpora/verify_wb1_report.py \
            scripts/corpora/publish_wb2_serving.py \
            scripts/corpora/verify_wb2_report.py
      - name: Run corpus unit regressions
        run: python -m unittest discover -s scripts/corpora/tests -p 'test_*.py' -v
      - name: Bootstrap clean PostgreSQL 17
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -f database/spikes/001/00_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/001_database_spike_001.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/002_wb2_serving_projection.sql
      - name: Fetch exact pinned sources
        run: python scripts/corpora/fetch_sources.py
      - name: Build accepted WB-CORPUS-001 source foundation
        run: python scripts/corpora/build_whole_bible_corpus.py
      - name: Revalidate source-foundation manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root=Path(".")
          manifest=json.loads((root/".local/whole-bible-corpus/coverage-manifest.json").read_text(encoding="utf-8"))
          schema=json.loads((root/"contracts/v1.1/json-schema/whole-bible-corpus-build-manifest.schema.json").read_text(encoding="utf-8"))
          errors=list(Draft202012Validator(schema).iter_errors(manifest))
          assert not errors, "\n".join(e.message for e in errors)
          assert manifest["gatePass"] is True
          assert manifest["coverage"]["silentReferenceLoss"] == 0
          PY
      - name: Rebuild accepted WB-1 relational source
        run: |
          mkdir -p .local/wb2/wb1/partitions .local/wb2/wb1/reports .local/wb2/wb1/sql .local/wb2/reports .local/wb2/sql
          python scripts/corpora/partition_wb_corpus_for_relational.py \
            --foundation-dir .local/whole-bible-corpus \
            --output-dir .local/wb2/wb1/partitions \
            --report .local/wb2/wb1/reports/partition.json
          python scripts/corpora/load_wb1_postgres.py \
            --oshb-dir .local/wb2/wb1/partitions/oshb \
            --bhsa-dir .local/wb2/wb1/partitions/bhsa \
            --crosswalk-dir .local/wb2/wb1/partitions/crosswalk \
            --source-foundation-manifest .local/whole-bible-corpus/coverage-manifest.json \
            --reference-inventory .local/whole-bible-corpus/reference-inventory.json \
            --partition-report .local/wb2/wb1/reports/partition.json \
            --report .local/wb2/wb1/reports/wb1-relational-coverage.json \
            --sql-dir .local/wb2/wb1/sql
          python scripts/corpora/verify_wb1_report.py \
            --report .local/wb2/wb1/reports/wb1-relational-coverage.json \
            --canon contracts/v1.1/hebrew-bible-canon-system.json \
            --source-foundation-manifest .local/whole-bible-corpus/coverage-manifest.json \
            --partition-report .local/wb2/wb1/reports/partition.json
      - name: Materialize inactive rights-safe WB-2 release
        run: |
          python scripts/corpora/publish_wb2_serving.py \
            --source-foundation-manifest .local/whole-bible-corpus/coverage-manifest.json \
            --wb1-report .local/wb2/wb1/reports/wb1-relational-coverage.json \
            --git-commit-sha "$SOURCE_GIT_SHA" \
            --report .local/wb2/reports/wb2-serving.json \
            --sql-output .local/wb2/sql/materialize.sql
      - name: Verify inactive materialization is not public
        run: |
          python scripts/corpora/verify_wb2_report.py \
            --report .local/wb2/reports/wb2-serving.json \
            --wb1-report .local/wb2/wb1/reports/wb1-relational-coverage.json \
            --source-foundation-manifest .local/whole-bible-corpus/coverage-manifest.json \
            --phase materialized
      - name: Publish WB-2 release atomically
        run: |
          RELEASE_ID="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path(".local/wb2/reports/wb2-serving.json").read_text(encoding="utf-8"))["researchReleaseId"])
          PY
          )"
          psql -v ON_ERROR_STOP=1 -v release_id="$RELEASE_ID" <<'SQL'
          SET ROLE publication_worker;
          SELECT publication_control.publish_release_to_channel(
            'PRODUCTION', :'release_id'::uuid, NULL, false
          );
          RESET ROLE;
          SQL
      - name: Verify published release and public isolation
        run: |
          python scripts/corpora/verify_wb2_report.py \
            --report .local/wb2/reports/wb2-serving.json \
            --wb1-report .local/wb2/wb1/reports/wb1-relational-coverage.json \
            --source-foundation-manifest .local/whole-bible-corpus/coverage-manifest.json \
            --phase published
      - name: Print compact WB-2 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".local/wb2/reports/wb2-serving.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "milestone":r["milestone"],
              "researchReleaseId":r["researchReleaseId"],
              "manifestHash":r["manifestHash"],
              "projectedSources":r["projectedSources"],
              "excludedSources":r["excludedSources"],
              "rights":r["rights"],
              "counts":r["counts"],
              "checks":r["checks"],
          },ensure_ascii=False,sort_keys=True,indent=2))
          PY
      - name: Upload WB-2 machine-auditable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wb2-serving-evidence
          path: |
            .local/whole-bible-corpus/reference-inventory.json
            .local/whole-bible-corpus/coverage-manifest.json
            .local/wb2/wb1/reports/partition.json
            .local/wb2/wb1/reports/wb1-relational-coverage.json
            .local/wb2/reports/wb2-serving.json
            .local/wb2/sql/materialize.sql
          if-no-files-found: warn
          retention-days: 30
