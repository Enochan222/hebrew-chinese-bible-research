name: Corpus source smoke

on:
  pull_request:
    paths:
      - 'contracts/v1.1/corpus-source-registry.json'
      - 'contracts/v1.1/json-schema/corpus-source-registry.schema.json'
      - 'scripts/corpora/**'
      - 'requirements-corpus.txt'
      - '.github/workflows/corpus-source-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install corpus tooling
        run: python -m pip install -r requirements-corpus.txt
      - name: Fetch exact pinned sources
        run: python scripts/corpora/fetch_sources.py
      - name: Adversarial corpus tooling guards
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import tempfile
          from pathlib import Path
          from scripts.corpora.fetch_sources import load_registry, safe_member_path, verify_cache

          source = {
              "sourceKey": "TEST_SOURCE",
              "repository": "example/repo",
              "pin": {"commitSha": "a" * 40, "datasetVersion": None},
              "acquisition": {"method": "RAW_FILES", "paths": ["data.txt"], "localSubdir": "test-source"},
          }
          with tempfile.TemporaryDirectory() as tmp:
              dest = Path(tmp)
              data = dest / "data.txt"
              data.write_text("fixture", encoding="utf-8")
              digest = hashlib.sha256(data.read_bytes()).hexdigest()
              manifest = {
                  "schemaVersion": "1.0",
                  "sourceKey": source["sourceKey"],
                  "repository": source["repository"],
                  "commitSha": source["pin"]["commitSha"],
                  "datasetVersion": None,
                  "registrySchemaVersion": load_registry()["schemaVersion"],
                  "acquisitionMethod": "RAW_FILES",
                  "acquisitionPaths": ["data.txt"],
                  "files": [{"path": "data.txt", "sha256": digest, "bytes": data.stat().st_size}],
              }
              manifest_path = dest / "source-manifest.json"
              manifest_path.write_text(json.dumps(manifest), encoding="utf-8")
              assert verify_cache(source, dest)[0], verify_cache(source, dest)

              truncated = dict(manifest)
              truncated["files"] = []
              manifest_path.write_text(json.dumps(truncated), encoding="utf-8")
              assert not verify_cache(source, dest)[0], "truncated manifest must fail closed"

              escaped = dict(manifest)
              escaped["files"] = [{"path": "../escape", "sha256": digest, "bytes": data.stat().st_size}]
              manifest_path.write_text(json.dumps(escaped), encoding="utf-8")
              assert not verify_cache(source, dest)[0], "manifest traversal path must fail closed"

              manifest_path.write_text(json.dumps(manifest), encoding="utf-8")
              extra = dest / "extra.txt"
              extra.write_text("unexpected", encoding="utf-8")
              assert not verify_cache(source, dest)[0], "untracked cache file must fail closed"

          try:
              safe_member_path("../escape")
          except ValueError:
              pass
          else:
              raise AssertionError("configured path traversal must be rejected")

          missing = Path(".local/exports/missing-oshb.ndjson")
          result = subprocess.run(
              [
                  "python", "scripts/corpora/export_oshb_words.py",
                  "--reference", "1Sam.16.999",
                  "--output", str(missing),
              ],
              check=False,
          )
          assert result.returncode != 0, "missing OSHB reference must exit non-zero"
          assert not missing.exists(), "missing OSHB reference must not leave an empty output artifact"
          PY
      - name: Export 1 Samuel 16:7 source layers
        run: |
          mkdir -p .local/exports
          python scripts/corpora/export_oshb_words.py --reference 1Sam.16.7 --output .local/exports/oshb.ndjson
          python scripts/corpora/export_bhsa_features.py --reference 1Sam.16.7 --output .local/exports/bhsa.ndjson
      - name: Build conservative candidate crosswalk
        run: |
          python scripts/corpora/build_candidate_crosswalk.py \
            --oshb .local/exports/oshb.ndjson \
            --bhsa .local/exports/bhsa.ndjson \
            --output .local/exports/crosswalk.ndjson
      - name: Verify smoke outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          counts = {}
          for name in ("oshb.ndjson", "bhsa.ndjson", "crosswalk.ndjson"):
              path = Path(".local/exports") / name
              rows = [json.loads(x) for x in path.read_text(encoding="utf-8").splitlines() if x.strip()]
              assert rows, f"{name} is empty"
              counts[name] = len(rows)
              print(name, len(rows))
          assert counts["oshb.ndjson"] == 25, counts
          assert counts["bhsa.ndjson"] > 0, counts
          crosswalk = [json.loads(x) for x in (Path(".local/exports") / "crosswalk.ndjson").read_text(encoding="utf-8").splitlines() if x.strip()]
          assert all(r.get("recordType") in {"CANDIDATE_SPAN_MAPPING", "ANNOTATION_ONLY_TARGET_NODE", "UNRESOLVED_REFERENCE"} for r in crosswalk)
          print("crosswalk record types", sorted({r["recordType"] for r in crosswalk}))
          candidate = [r for r in crosswalk if r["recordType"] == "CANDIDATE_SPAN_MAPPING"]
          annotation_only = [r for r in crosswalk if r["recordType"] == "ANNOTATION_ONLY_TARGET_NODE"]
          unresolved = [r for r in crosswalk if r["recordType"] == "UNRESOLVED_REFERENCE"]
          assert candidate, "real 1 Sam 16:7 integration produced no candidate span mappings"
          assert not unresolved, unresolved
          assert {r["targetProviderScopedNodeId"] for r in annotation_only} == {150439, 150445}, annotation_only
          assert all(r["partOfSpeechRaw"] == "art" for r in annotation_only), annotation_only
          assert all(r["orthographicMappingEligible"] is False for r in annotation_only), annotation_only
          assert any(r["sourceCount"] != r["targetCount"] for r in candidate), "smoke did not exercise many-to-many segmentation"
          PY
