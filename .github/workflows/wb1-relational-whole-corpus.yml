name: WB-1 Relational Whole Corpus

on:
  pull_request:
    paths:
      - 'database/**'
      - 'scripts/corpora/**'
      - 'requirements-corpus.txt'
      - 'requirements-contracts.txt'
      - 'contracts/v1.1/corpus-source-registry.json'
      - 'contracts/v1.1/hebrew-bible-canon-system.json'
      - 'contracts/v1.1/json-schema/hebrew-bible-canon-system.schema.json'
      - 'contracts/v1.1/json-schema/whole-bible-corpus-build-manifest.schema.json'
      - 'architecture/whole-bible-base-product.md'
      - 'architecture/corpus-source-integration.md'
      - 'architecture/database-api-cross-stage-contract-v1.1.md'
      - '.github/workflows/wb1-relational-whole-corpus.yml'
      - 'PROJECT_STATE.md'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'scripts/corpora/**'
      - 'requirements-corpus.txt'
      - 'requirements-contracts.txt'
      - 'contracts/v1.1/corpus-source-registry.json'
      - 'contracts/v1.1/hebrew-bible-canon-system.json'
      - 'contracts/v1.1/json-schema/hebrew-bible-canon-system.schema.json'
      - 'contracts/v1.1/json-schema/whole-bible-corpus-build-manifest.schema.json'
      - 'architecture/whole-bible-base-product.md'
      - 'architecture/corpus-source-integration.md'
      - 'architecture/database-api-cross-stage-contract-v1.1.md'
      - '.github/workflows/wb1-relational-whole-corpus.yml'

permissions:
  contents: read

jobs:
  wb1-relational:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hcb_wb1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hcb_wb1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hcb_wb1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned corpus and contract tooling
        run: python -m pip install -r requirements-corpus.txt -r requirements-contracts.txt
      - name: Compile WB-1 tooling
        run: |
          python -m py_compile \
            scripts/corpora/partition_wb_corpus_for_relational.py \
            scripts/corpora/load_wb1_postgres.py \
            scripts/corpora/verify_wb1_report.py
      - name: Run corpus/WB-1 unit regressions
        run: python -m unittest discover -s scripts/corpora/tests -p 'test_*.py' -v
      - name: Bootstrap clean PostgreSQL 17
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -f database/spikes/001/00_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/001_database_spike_001.sql
      - name: Fetch exact pinned sources
        run: python scripts/corpora/fetch_sources.py
      - name: Build accepted WB-CORPUS-001 source foundation
        run: python scripts/corpora/build_whole_bible_corpus.py
      - name: Revalidate source-foundation manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root=Path(".")
          manifest=json.loads((root/".local/whole-bible-corpus/coverage-manifest.json").read_text(encoding="utf-8"))
          schema=json.loads((root/"contracts/v1.1/json-schema/whole-bible-corpus-build-manifest.schema.json").read_text(encoding="utf-8"))
          errors=list(Draft202012Validator(schema).iter_errors(manifest))
          assert not errors, "\n".join(e.message for e in errors)
          assert manifest["gatePass"] is True
          assert manifest["coverage"]["silentReferenceLoss"] == 0
          PY
      - name: Partition accepted foundation into bounded relational inputs
        run: |
          mkdir -p .local/wb1/partitions .local/wb1/reports .local/wb1/sql
          python scripts/corpora/partition_wb_corpus_for_relational.py \
            --foundation-dir .local/whole-bible-corpus \
            --output-dir .local/wb1/partitions \
            --report .local/wb1/reports/partition.json
      - name: Import whole configured corpus into Authoring
        run: |
          python scripts/corpora/load_wb1_postgres.py \
            --oshb-dir .local/wb1/partitions/oshb \
            --bhsa-dir .local/wb1/partitions/bhsa \
            --crosswalk-dir .local/wb1/partitions/crosswalk \
            --source-foundation-manifest .local/whole-bible-corpus/coverage-manifest.json \
            --reference-inventory .local/whole-bible-corpus/reference-inventory.json \
            --partition-report .local/wb1/reports/partition.json \
            --report .local/wb1/reports/wb1-relational-coverage.json \
            --sql-dir .local/wb1/sql
      - name: Verify relational/source parity
        run: |
          python scripts/corpora/verify_wb1_report.py \
            --report .local/wb1/reports/wb1-relational-coverage.json \
            --canon contracts/v1.1/hebrew-bible-canon-system.json \
            --source-foundation-manifest .local/whole-bible-corpus/coverage-manifest.json \
            --partition-report .local/wb1/reports/partition.json
      - name: Assert no real corpus Serving projection
        run: |
          test "$(psql -At -c 'SELECT count(*) FROM serving.corpus_nodes;')" = "0"
      - name: Print compact WB-1 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".local/wb1/reports/wb1-relational-coverage.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "milestone":r["milestone"],
              "sourceFoundation":r["sourceFoundation"],
              "canonSystem":r["canonSystem"],
              "totals":r["totals"],
              "gate":r["gate"],
              "coverage":r["coverage"],
          },ensure_ascii=False,sort_keys=True,indent=2))
          PY
      - name: Upload WB-1 machine-auditable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wb1-relational-evidence
          path: |
            .local/whole-bible-corpus/reference-inventory.json
            .local/whole-bible-corpus/coverage-manifest.json
            .local/wb1/reports/partition.json
            .local/wb1/reports/wb1-relational-coverage.json
          if-no-files-found: warn
          retention-days: 30
