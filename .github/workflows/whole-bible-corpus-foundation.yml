name: Whole-Bible corpus foundation

on:
  pull_request:
    paths:
      - 'contracts/v1.1/corpus-source-registry.json'
      - 'contracts/v1.1/json-schema/whole-bible-corpus-build-manifest.schema.json'
      - 'contracts/v1.1/fixtures/whole-bible-corpus-build-manifest.json'
      - 'scripts/corpora/**'
      - 'requirements-corpus.txt'
      - '.github/workflows/whole-bible-corpus-foundation.yml'
      - 'architecture/corpus-source-integration.md'
      - 'architecture/whole-bible-base-product.md'
      - 'architecture/site-build-staging-plan.md'
      - 'PROJECT_STATE.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wb-corpus-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install corpus tooling
        run: python -m pip install -r requirements-corpus.txt
      - name: Run corpus unit tests
        run: python -m unittest discover -s scripts/corpora/tests -p 'test_*.py' -v
      - name: Fetch exact pinned sources
        run: python scripts/corpora/fetch_sources.py
      - name: Build complete pinned corpus foundation
        run: python scripts/corpora/build_whole_bible_corpus.py
      - name: Validate generated coverage manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path(".")
          manifest_path = root / ".local/whole-bible-corpus/coverage-manifest.json"
          schema = json.loads((root / "contracts/v1.1/json-schema/whole-bible-corpus-build-manifest.schema.json").read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          errors = sorted(Draft202012Validator(schema).iter_errors(manifest), key=lambda error: list(error.path))
          assert not errors, "\n".join(error.message for error in errors)
          assert manifest["gatePass"] is True, manifest
          assert manifest["coverage"]["silentReferenceLoss"] == 0, manifest
          assert manifest["referenceSystem"]["expectedReferenceSpans"] > 0, manifest
          assert manifest["coverage"]["oshb"]["referenceSpans"] == manifest["referenceSystem"]["expectedReferenceSpans"], manifest
          print(json.dumps({
              "buildId": manifest["buildId"],
              "status": manifest["status"],
              "referenceSystem": manifest["referenceSystem"],
              "coverage": manifest["coverage"],
              "exceptionCounts": {key: len(value) for key, value in manifest["exceptions"].items()},
          }, sort_keys=True))
          PY
      - name: Verify 1 Samuel 16:7 remains an acceptance canary
        run: |
          python scripts/corpora/export_oshb_words.py --reference 1Sam.16.7 --output .local/whole-bible-corpus/canary-oshb.ndjson
          python scripts/corpora/export_bhsa_features.py --reference 1Sam.16.7 --output .local/whole-bible-corpus/canary-bhsa.ndjson
          python scripts/corpora/build_candidate_crosswalk.py --oshb .local/whole-bible-corpus/canary-oshb.ndjson --bhsa .local/whole-bible-corpus/canary-bhsa.ndjson --output .local/whole-bible-corpus/canary-crosswalk.ndjson
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".local/whole-bible-corpus")
          oshb = [json.loads(x) for x in (root / "canary-oshb.ndjson").read_text(encoding="utf-8").splitlines() if x.strip()]
          crosswalk = [json.loads(x) for x in (root / "canary-crosswalk.ndjson").read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(oshb) == 25
          assert not [x for x in crosswalk if x["recordType"] == "UNRESOLVED_REFERENCE"]
          assert {x["targetProviderScopedNodeId"] for x in crosswalk if x["recordType"] == "ANNOTATION_ONLY_TARGET_NODE"} == {150439, 150445}
          PY
      - name: Upload machine-auditable corpus evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wb-corpus-001-evidence
          path: |
            .local/whole-bible-corpus/reference-inventory.json
            .local/whole-bible-corpus/coverage-manifest.json
          if-no-files-found: error
