name: Contract validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: pip install -r requirements-contracts.txt
      - name: Validate contracts and governance
        run: python scripts/validate_contracts.py
      - name: Validate Core OpenAPI
        run: openapi-spec-validator contracts/v1.1/openapi.yaml
      - name: Validate Research Pro OpenAPI when present
        run: |
          if [ -f contracts/v1.1/research-pro-openapi.yaml ]; then
            openapi-spec-validator contracts/v1.1/research-pro-openapi.yaml
          fi
