name: Database Spike 001

on:
  pull_request:
    paths:
      - 'database/**'
      - 'scripts/corpora/**'
      - 'requirements-corpus.txt'
      - 'contracts/v1.1/corpus-source-registry.json'
      - 'contracts/v1.1/json-schema/corpus-source-registry.schema.json'
      - 'architecture/corpus-source-integration.md'
      - 'architecture/database-api-cross-stage-contract-v1.1.md'
      - 'architecture/database-spikes/001-scholarly-integrity-vertical-slice.md'
      - '.github/workflows/database-spike-001.yml'
      - 'PROJECT_STATE.md'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'scripts/corpora/**'
      - 'requirements-corpus.txt'
      - 'contracts/v1.1/corpus-source-registry.json'
      - 'contracts/v1.1/json-schema/corpus-source-registry.schema.json'
      - 'architecture/corpus-source-integration.md'
      - 'architecture/database-api-cross-stage-contract-v1.1.md'
      - 'architecture/database-spikes/001-scholarly-integrity-vertical-slice.md'
      - '.github/workflows/database-spike-001.yml'

permissions:
  contents: read

jobs:
  postgres-spike:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hcb_spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hcb_spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hcb_spike
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Static-check migration transaction boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("database/migrations/001_database_spike_001.sql")
          text = p.read_text(encoding="utf-8")
          if text.count("COMMIT;") != 1:
              raise SystemExit("Database Spike migration must contain exactly one COMMIT;")
          before, after = text.split("COMMIT;", 1)
          if after.strip():
              raise SystemExit("Unexpected SQL exists after the Database Spike migration COMMIT;")
          if "BEGIN;" not in before:
              raise SystemExit("Database Spike migration must begin an explicit transaction")
          if "\nAS $\n" in text or "\n$;\n" in text:
              raise SystemExit("Database Spike migration contains an invalid single-dollar PL/pgSQL delimiter")
          PY
      - name: Bootstrap Supabase-compatible test roles
        run: psql -v ON_ERROR_STOP=1 -f database/spikes/001/00_bootstrap.sql
      - name: Apply Database Spike 001 migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/001_database_spike_001.sql
      - name: Apply WB-4 translation Serving migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/002_wb4_translation_serving.sql
      - name: Load controlled fixtures
        run: psql -v ON_ERROR_STOP=1 -f database/spikes/001/01_seed.sql
      - name: Run adversarial SQL tests
        run: psql -v ON_ERROR_STOP=1 -f database/spikes/001/02_tests.sql
      - name: Run WB-4 translation witness adversarial tests
        run: psql -v ON_ERROR_STOP=1 -f database/spikes/001/06_translation_witness_tests.sql
      - name: Capture representative query plan
        run: psql -v ON_ERROR_STOP=1 -f database/spikes/001/03_query_plan.sql

  wb0-real-corpus-canary:
    needs: postgres-spike
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hcb_wb0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hcb_wb0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hcb_wb0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install corpus tooling
        run: python -m pip install -r requirements-corpus.txt
      - name: Verify WB-0 loader syntax
        run: python -m py_compile scripts/corpora/load_wb0_postgres.py
      - name: Bootstrap clean PostgreSQL canary database
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -f database/spikes/001/00_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/001_database_spike_001.sql
      - name: Fetch exact pinned real corpus sources
        run: python scripts/corpora/fetch_sources.py
      - name: Export pinned 1 Samuel 16:7 provider records
        run: |
          mkdir -p .local/exports
          python scripts/corpora/export_oshb_words.py \
            --reference 1Sam.16.7 \
            --output .local/exports/oshb-wb0.ndjson
          python scripts/corpora/export_bhsa_features.py \
            --reference 1Sam.16.7 \
            --output .local/exports/bhsa-wb0.ndjson
      - name: Build non-canonical grouped crosswalk candidates
        run: |
          python scripts/corpora/build_candidate_crosswalk.py \
            --oshb .local/exports/oshb-wb0.ndjson \
            --bhsa .local/exports/bhsa-wb0.ndjson \
            --output .local/exports/crosswalk-wb0.ndjson
      - name: Load real corpus canary into Authoring
        run: |
          python scripts/corpora/load_wb0_postgres.py \
            --oshb .local/exports/oshb-wb0.ndjson \
            --bhsa .local/exports/bhsa-wb0.ndjson \
            --crosswalk .local/exports/crosswalk-wb0.ndjson \
            --report .local/exports/wb0-relational-report.json \
            --emit-sql .local/exports/wb0-load.sql
          cat .local/exports/wb0-relational-report.json
      - name: Run WB-0 real-corpus relational assertions
        run: psql -v ON_ERROR_STOP=1 -f database/spikes/001/04_real_corpus_tests.sql
      - name: Verify WB-0 evidence report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".local/exports/wb0-relational-report.json").read_text(encoding="utf-8"))
          assert report["milestone"] == "WB-0"
          assert report["reference"] == "1Sam.16.7"
          assert report["counts"]["oshbWordNodes"] == 25
          assert report["counts"]["bhsaWordNodes"] == 34
          assert report["counts"]["bhsaTextBearingWordNodes"] == 32
          assert report["counts"]["bhsaAnnotationOnlyWordNodes"] == 2
          assert report["counts"]["bhsaPhraseNodes"] == 22
          assert report["counts"]["bhsaClauseNodes"] == 7
          assert report["counts"]["bhsaMembershipEdges"] == 90
          assert report["counts"]["bridgeFeatureValues"] == 35
          assert report["counts"]["candidateMappingGroups"] == 25
          assert report["counts"]["manyToManyCandidateGroups"] == 7
          assert report["counts"]["projectBodyPartTargetNodes"] == 1
          assert report["counts"]["unresolvedReferences"] == 0
          assert report["inputSha256"]["oshb"] == "3ddba4e8a39959effd6ae7b803d1bbd6ab95be52a5641ace8d2b0262e76a3b33"
          assert report["inputSha256"]["bhsa"] == "4b83026a29adc352ff910679f4f7cfe69d06385438363393da75f0bc0f7e0836"
          assert report["inputSha256"]["crosswalk"] == "9d8f815625bdd580cb777bd3a3dfc1e65bdf65a93a651fa1d04e2f66fc24bb72"
          assert report["canonicalCandidateMappings"] == 0
          assert report["servingProjectionWritten"] is False
          assert report["annotationOnlyProviderNodeIds"] == ["150439", "150445"]
          print(json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2))
          PY

