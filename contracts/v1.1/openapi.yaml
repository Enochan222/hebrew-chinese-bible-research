openapi: 3.1.0
info:
  title: Hebrew-Chinese Bible Research Core API
  version: 1.1-candidate
  description: >
    Normative machine contract for the Core v1.1 serving profile. Research Pro
    extension endpoints are governed separately until their extension profile is frozen.
    Canonical scholarly responses expose the resolved ResearchRelease.
servers:
  - url: /
paths:
  /api/v1/releases/current:
    get:
      operationId: getCurrentRelease
      responses:
        '200':
          description: Current production release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleasePointer'
  /api/v1/passages/{reference}:
    get:
      operationId: getCurrentPassage
      parameters:
        - $ref: '#/components/parameters/reference'
        - $ref: '#/components/parameters/referenceSystemCode'
      responses:
        '200':
          description: Current-release passage core
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassageCore'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/releases/{releaseId}/passages/{reference}:
    get:
      operationId: getPinnedPassage
      parameters:
        - $ref: '#/components/parameters/releaseId'
        - $ref: '#/components/parameters/reference'
        - $ref: '#/components/parameters/referenceSystemCode'
      responses:
        '200':
          description: Pinned passage core
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassageCore'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/passages/{reference}/translations:
    get:
      operationId: getCurrentPassageTranslations
      parameters:
        - $ref: '#/components/parameters/reference'
        - $ref: '#/components/parameters/referenceSystemCode'
      responses:
        '200':
          description: Translation witnesses resolved from current release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationWitnessList'
  /api/v1/releases/{releaseId}/passages/{reference}/translations:
    get:
      operationId: getPinnedPassageTranslations
      parameters:
        - $ref: '#/components/parameters/releaseId'
        - $ref: '#/components/parameters/reference'
        - $ref: '#/components/parameters/referenceSystemCode'
      responses:
        '200':
          description: Translation witnesses from pinned release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationWitnessList'
  /api/v1/passages/{reference}/analysis:
    get:
      operationId: getCurrentPassageAnalysis
      parameters:
        - $ref: '#/components/parameters/reference'
        - $ref: '#/components/parameters/referenceSystemCode'
      responses:
        '200':
          description: Current release published analysis
          content:
            application/json:
              schema:
                $ref: './json-schema/published-passage-analysis.schema.json'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/releases/{releaseId}/passages/{reference}/analysis:
    get:
      operationId: getPinnedPassageAnalysis
      parameters:
        - $ref: '#/components/parameters/releaseId'
        - $ref: '#/components/parameters/reference'
        - $ref: '#/components/parameters/referenceSystemCode'
      responses:
        '200':
          description: Citation-stable pinned published analysis
          content:
            application/json:
              schema:
                $ref: './json-schema/published-passage-analysis.schema.json'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/passages/{reference}/rule-applications:
    get:
      operationId: getCurrentRuleApplications
      parameters:
        - $ref: '#/components/parameters/reference'
        - $ref: '#/components/parameters/referenceSystemCode'
      responses:
        '200':
          description: Rule applications from current release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleApplicationList'
  /api/v1/releases/{releaseId}/passages/{reference}/rule-applications:
    get:
      operationId: getPinnedRuleApplications
      parameters:
        - $ref: '#/components/parameters/releaseId'
        - $ref: '#/components/parameters/reference'
        - $ref: '#/components/parameters/referenceSystemCode'
      responses:
        '200':
          description: Rule applications from pinned release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleApplicationList'
  /api/v1/constructions/{constructionId}/instances:
    get:
      operationId: getConstructionInstances
      parameters:
        - $ref: '#/components/parameters/constructionId'
        - $ref: '#/components/parameters/optionalReleaseId'
      responses:
        '200':
          description: Release-pinned construction instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructionInstanceList'
  /api/v1/semantic-sets:
    get:
      operationId: listSemanticSets
      parameters:
        - $ref: '#/components/parameters/optionalReleaseId'
      responses:
        '200':
          description: Semantic sets available in resolved release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticSetList'
  /api/v1/corpus/query/validate:
    post:
      operationId: validateCorpusQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './json-schema/corpus-query.schema.json'
      responses:
        '200':
          description: Validation and release-pinning result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [valid, errors]
                properties:
                  valid:
                    type: boolean
                  normalizedQuery:
                    oneOf:
                      - $ref: './json-schema/corpus-query-normalized.schema.json'
                      - type: 'null'
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationError'
  /api/v1/corpus/query/run:
    post:
      operationId: runCorpusQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './json-schema/corpus-query-execution-request.schema.json'
      responses:
        '200':
          description: Deterministic release-pinned query page
          content:
            application/json:
              schema:
                $ref: './json-schema/corpus-query-result.schema.json'
        '400':
          description: Invalid, stale, or over-complex query
  /api/v1/evidence/{evidenceId}:
    get:
      operationId: getPublishedEvidence
      parameters:
        - $ref: '#/components/parameters/evidenceId'
      responses:
        '200':
          description: Public-safe published evidence item
          content:
            application/json:
              schema:
                $ref: './json-schema/published-evidence-item.schema.json'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    releaseId:
      name: releaseId
      in: path
      required: true
      schema: {type: string, format: uuid}
    optionalReleaseId:
      name: researchReleaseId
      in: query
      required: false
      description: Omission resolves current PRODUCTION once for this request.
      schema: {type: string, format: uuid}
    reference:
      name: reference
      in: path
      required: true
      description: Human-readable label within the explicitly supplied reference system.
      schema: {type: string, minLength: 1}
    referenceSystemCode:
      name: referenceSystemCode
      in: query
      required: true
      description: Reference-system code used to resolve the human label deterministically to ReferenceSpan.
      schema: {type: string, minLength: 1}
    evidenceId:
      name: evidenceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    constructionId:
      name: constructionId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    ReleasePointer:
      $ref: './json-schema/release-pointer.schema.json'
    PassageCore:
      $ref: './json-schema/passage-core.schema.json'
    TranslationWitnessList:
      type: object
      additionalProperties: false
      required: [researchReleaseId, witnesses]
      properties:
        researchReleaseId: {type: string, format: uuid}
        witnesses:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [digitalExpressionId, displayName, bindingMode]
            properties:
              digitalExpressionId: {type: string, format: uuid}
              displayName: {type: string}
              bindingMode: {enum: [SNAPSHOT_PINNED, LIVE_EXTERNAL]}
    RuleApplicationList:
      type: object
      additionalProperties: false
      required: [researchReleaseId, items]
      properties:
        researchReleaseId: {type: string, format: uuid}
        items:
          type: array
          items:
            $ref: './json-schema/rule-application.schema.json'
    ConstructionInstanceList:
      type: object
      additionalProperties: false
      required: [researchReleaseId, items]
      properties:
        researchReleaseId: {type: string, format: uuid}
        items:
          type: array
          items:
            $ref: './json-schema/construction-instance.schema.json'
    SemanticSetList:
      type: object
      additionalProperties: false
      required: [researchReleaseId, items]
      properties:
        researchReleaseId: {type: string, format: uuid}
        items:
          type: array
          items:
            $ref: './json-schema/semantic-set-version.schema.json'
    ValidationError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        path: {type: string}
  responses:
    NotFound:
      description: Requested release/resource not found
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code: {const: NOT_FOUND}
              message: {type: string}
